name: Публикация на GitHub Pages

# Прежний PWA-путь собирается из актуального основного репозитория. Так старые
# установки сохраняют свой URL и данные, но получают тот же интерфейс и снимки.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать актуальное приложение
        uses: actions/checkout@v4
        with:
          repository: Gerakl-ai/lad-vlsu
          ref: main

      - name: Определить версию основного приложения
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Проверить перед публикацией
        run: |
          pnpm test
          node --check public/sw.js

      - name: Собрать приложение
        env:
          LAD_RELEASE_SHA: ${{ steps.source.outputs.sha }}
          PAGES_BASE: /${{ github.event.repository.name }}/
          VITE_SCHEDULE_FALLBACK_URL: https://vlsu-pi-124-schedule.polkin-06.workers.dev
        run: pnpm run build

      - name: Добавить снимки расписания из ветки data
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data --depth=1
            git worktree add snapshot-data origin/data
            mkdir -p dist/data
            cp -r snapshot-data/data/. dist/data/
            echo "Снимков расписания: $(find dist/data/schedule -name '*.json' 2>/dev/null | wc -l)"
          else
            echo "::warning::Ветки data ещё нет — сайт соберётся без снимков расписания."
          fi

      - name: Сделать SPA-маршруты рабочими
        # Pages отдаёт 404.html для неизвестных путей. Копия index.html делает
        # прямые ссылки вида /g/ПИ-124 рабочими без серверной маршрутизации.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
