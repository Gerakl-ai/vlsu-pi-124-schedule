<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Лад ВлГУ">
  <title>Лад ВлГУ</title>
  <!--
    Монохромный вариант: система сама красит форму, поэтому фон прозрачный,
    а сам знак нарисован одним цветом без полутонов.
  -->
  <g fill="black">
    <rect x="172" y="160" width="168" height="48" rx="24"/>
    <rect x="116" y="242" width="280" height="28" rx="14"/>
    <rect x="200" y="304" width="112" height="48" rx="24"/>
  </g>
</svg>
