<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#061622" />
    <meta name="description" content="Личное расписание ПИ-124, ИИТЭ, ВлГУ" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ПИ-124" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-512.png" />
    <link rel="preload" href="/images/brand-mark.png" as="image" />
    <link rel="preload" href="/images/hero-schedule.png" as="image" />
    <style>
      :root {
        color-scheme: dark;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }

      html,
      body,
      #root {
        width: 100%;
        min-width: 320px;
        min-height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background:
          radial-gradient(420px 360px at 78% 10%, rgba(37, 228, 232, 0.2), transparent 64%),
          linear-gradient(180deg, #061724, #020b12);
        color: #f7fbff;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .launch-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: calc(24px + var(--safe-top)) 24px calc(24px + var(--safe-bottom));
        background:
          linear-gradient(118deg, transparent 0 46%, rgba(37, 228, 232, 0.13) 46% 46.5%, transparent 46.5%),
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.03) 0 1px, transparent 1px 42px),
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.02) 0 1px, transparent 1px 42px),
          linear-gradient(180deg, #071c2c, #020b12);
      }

      .launch-card {
        width: min(100%, 360px);
        display: grid;
        gap: 22px;
        padding: 26px;
        border: 1px solid rgba(37, 228, 232, 0.38);
        border-radius: 8px;
        background: linear-gradient(145deg, rgba(13, 44, 64, 0.92), rgba(4, 17, 29, 0.95));
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }

      .launch-brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .launch-icon {
        width: 58px;
        height: 58px;
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(37, 228, 232, 0.22), rgba(255, 109, 96, 0.14)),
          url("/images/brand-mark.png") center / cover;
        box-shadow: 0 0 34px rgba(37, 228, 232, 0.22);
      }

      .launch-brand strong {
        display: block;
        font-size: 28px;
        line-height: 1;
        font-weight: 900;
      }

      .launch-brand span {
        display: block;
        margin-top: 6px;
        color: #25e4e8;
        font-size: 14px;
        font-weight: 900;
      }

      .launch-line {
        height: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(210, 235, 242, 0.14);
      }

      .launch-line::before {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #ff6d60, #25e4e8);
        animation: launch-load 1.05s ease-in-out infinite alternate;
      }

      .launch-card p {
        margin: 0;
        color: #9fb3c4;
        font-size: 13px;
        line-height: 1.35;
        font-weight: 800;
      }

      @keyframes launch-load {
        from { transform: translateX(0); }
        to { transform: translateX(138%); }
      }
    </style>
    <title>ПИ-124 | Расписание</title>
  </head>
  <body>
    <div id="root">
      <div class="launch-screen" aria-label="Загрузка расписания ПИ-124">
        <div class="launch-card">
          <div class="launch-brand">
            <div class="launch-icon"></div>
            <div>
              <strong>ПИ-124</strong>
              <span>ИИТЭ / ВлГУ</span>
            </div>
          </div>
          <div class="launch-line"></div>
          <p>Поднимаем расписание и кэш, чтобы сразу открыть сегодняшний день.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
