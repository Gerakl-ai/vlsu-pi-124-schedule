<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#090a0c" />
    <meta name="description" content="Лад: расписание и умные записи ПИ-124, ИИТЭ, ВлГУ" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Лад" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-512.png" />
    <link rel="preload" href="/icons/icon-192.png" as="image" />
    <script>
      (() => {
        const allowed = new Set(["obsidian", "porcelain", "signal", "field", "midnight", "aurora", "glacier", "atelier", "custom"]);
        let theme = "signal";
        try {
          const stored = localStorage.getItem("lad.theme");
          if (allowed.has(stored)) theme = stored;
        } catch {}
        document.documentElement.dataset.theme = theme;
        let custom = null;
        if (theme === "custom") {
          try { custom = JSON.parse(localStorage.getItem("lad.custom-theme") || "null"); } catch {}
        }
        const lightMode = custom?.mode === "light" || theme === "porcelain" || theme === "glacier" || theme === "atelier";
        document.documentElement.dataset.themeMode = lightMode ? "light" : "dark";
        document.documentElement.style.colorScheme = custom?.mode || (lightMode ? "light" : "dark");
        const colors = {
          obsidian: "#05070a",
          porcelain: "#eef2f7",
          signal: "#090a0c",
          field: "#07110f",
          midnight: "#070914",
          aurora: "#06110f",
          glacier: "#f1f7fb",
          atelier: "#f7f5fa",
          custom: custom?.background || "#080b12"
        };
        const chromeColor = colors[theme];
        document.documentElement.style.backgroundColor = chromeColor;
        if (custom) {
          const root = document.documentElement.style;
          root.setProperty("--launch-bg", custom.background);
          root.setProperty("--launch-panel", custom.surface);
          root.setProperty("--launch-line", `${custom.accent}33`);
          root.setProperty("--launch-text", custom.text);
          root.setProperty("--launch-muted", custom.muted);
          root.setProperty("--launch-accent", custom.accent);
          root.setProperty("--launch-signal", custom.signal);
        }
        const heroPreload = document.createElement("link");
        heroPreload.rel = "preload";
        heroPreload.as = "image";
        heroPreload.href = lightMode ? "/images/hero-porcelain-campus.jpg" : "/images/hero-obsidian-campus.jpg";
        document.head.appendChild(heroPreload);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", chromeColor);
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute("content", lightMode ? "default" : "black-translucent");
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --app-viewport-height: 100dvh;
        --visual-viewport-height: 100dvh;
        --visual-viewport-offset-top: 0px;
        --launch-bg: #05070a;
        --launch-panel: rgba(10, 16, 26, 0.84);
        --launch-line: rgba(183, 215, 255, 0.16);
        --launch-text: #f7fbff;
        --launch-muted: #8e9bad;
        --launch-accent: #8fb8ff;
        --launch-signal: #ff6b5f;
      }

      :root[data-theme="porcelain"] {
        --launch-bg: #eef2f7;
        --launch-panel: rgba(255, 255, 255, 0.82);
        --launch-line: rgba(17, 24, 39, 0.15);
        --launch-text: #111827;
        --launch-muted: #5b6678;
        --launch-accent: #2457d6;
        --launch-signal: #e4473e;
      }

      :root[data-theme="signal"] {
        --launch-bg: #090a0c;
        --launch-panel: rgba(24, 25, 27, 0.88);
        --launch-line: rgba(242, 240, 234, 0.15);
        --launch-text: #f2f0ea;
        --launch-muted: #9c9b97;
        --launch-accent: #58dfc2;
        --launch-signal: #ff4d52;
      }

      :root[data-theme="field"] {
        --launch-bg: #07110f;
        --launch-panel: rgba(11, 29, 24, 0.88);
        --launch-line: rgba(216, 231, 220, 0.15);
        --launch-text: #edf3ee;
        --launch-muted: #98aaa0;
        --launch-accent: #bdd45a;
        --launch-signal: #78a9ff;
      }

      :root[data-theme="midnight"] {
        --launch-bg: #070914;
        --launch-panel: rgba(17, 21, 42, 0.9);
        --launch-line: rgba(122, 162, 255, 0.19);
        --launch-text: #f2f5ff;
        --launch-muted: #a4aec8;
        --launch-accent: #7aa2ff;
        --launch-signal: #ffbf69;
      }

      :root[data-theme="aurora"] {
        --launch-bg: #06110f;
        --launch-panel: rgba(9, 31, 27, 0.9);
        --launch-line: rgba(98, 230, 197, 0.19);
        --launch-text: #effff9;
        --launch-muted: #9ebbb2;
        --launch-accent: #62e6c5;
        --launch-signal: #ff7895;
      }

      :root[data-theme="glacier"] {
        --launch-bg: #f1f7fb;
        --launch-panel: rgba(255, 255, 255, 0.9);
        --launch-line: rgba(8, 127, 156, 0.18);
        --launch-text: #102333;
        --launch-muted: #5b7180;
        --launch-accent: #087f9c;
        --launch-signal: #e75564;
      }

      :root[data-theme="atelier"] {
        --launch-bg: #f7f5fa;
        --launch-panel: rgba(255, 255, 255, 0.92);
        --launch-line: rgba(76, 91, 212, 0.17);
        --launch-text: #201b2c;
        --launch-muted: #716a7f;
        --launch-accent: #4c5bd4;
        --launch-signal: #c53f68;
      }

      html,
      body,
      #root {
        width: 100%;
        min-width: 320px;
        height: var(--app-viewport-height);
        min-height: var(--app-viewport-height);
        margin: 0;
        overflow: hidden;
      }

      html {
        background-color: var(--launch-bg);
      }

      body {
        position: fixed;
        inset: 0;
        width: 100%;
        overflow: hidden;
        height: var(--app-viewport-height);
        background: var(--launch-bg);
        color: var(--launch-text);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .launch-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: calc(24px + var(--safe-top)) 24px calc(24px + var(--safe-bottom));
        background:
          linear-gradient(118deg, transparent 0 46%, color-mix(in srgb, var(--launch-accent) 12%, transparent) 46% 46.5%, transparent 46.5%),
          repeating-linear-gradient(90deg, color-mix(in srgb, var(--launch-accent) 5%, transparent) 0 1px, transparent 1px 42px),
          repeating-linear-gradient(0deg, color-mix(in srgb, var(--launch-accent) 3%, transparent) 0 1px, transparent 1px 42px),
          var(--launch-bg);
      }

      .launch-card {
        width: min(100%, 330px);
        display: grid;
        gap: 24px;
        padding: 24px;
        border: 1px solid var(--launch-line);
        border-radius: 8px;
        background: var(--launch-panel);
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
      }

      .launch-brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .launch-icon {
        width: 68px;
        height: 68px;
        border-radius: 8px;
        background:
          linear-gradient(135deg, color-mix(in srgb, var(--launch-accent) 20%, transparent), color-mix(in srgb, var(--launch-signal) 12%, transparent)),
          url("/icons/icon-192.png") center / cover;
        box-shadow: 0 0 34px color-mix(in srgb, var(--launch-accent) 22%, transparent);
      }

      .launch-brand strong {
        display: block;
        font-size: 30px;
        line-height: 1;
        font-weight: 900;
      }

      .launch-brand span {
        display: block;
        margin-top: 6px;
        color: var(--launch-accent);
        font-size: 14px;
        font-weight: 900;
      }

      .launch-line {
        height: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--launch-line);
      }

      .launch-line::before {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--launch-signal), var(--launch-accent));
        animation: launch-load 1.05s ease-in-out infinite alternate;
      }

      .launch-card p {
        margin: 0;
        color: var(--launch-muted);
        font-size: 13px;
        line-height: 1.35;
        font-weight: 800;
      }

      @keyframes launch-load {
        from { transform: translateX(0); }
        to { transform: translateX(138%); }
      }
    </style>
    <title>Лад · ПИ-124</title>
  </head>
  <body>
    <div id="root">
      <div class="launch-screen" aria-label="Загрузка расписания ПИ-124">
        <div class="launch-card">
          <div class="launch-brand">
            <div class="launch-icon"></div>
            <div>
              <strong>ПИ-124</strong>
              <span>ЛАД · ИИТЭ / ВлГУ</span>
            </div>
          </div>
          <div class="launch-line"></div>
          <p>Собираем сегодняшний ритм.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
